name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Docker image builds and starts
        run: |
          docker build -t antragshelfer .
          docker run -d --name app -p 3100:3100 -e TRUST_PROXY_HOPS=0 antragshelfer
          for i in $(seq 1 20); do curl -sf localhost:3100/api/health && break; sleep 1; done
          curl -sf localhost:3100/ | grep -q Antragshelfer
